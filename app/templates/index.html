<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — AAPM SENAI</title>
    <!-- Fontes Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- DESIGN SYSTEM MODERNIZADO (DARK-PREMIUM / GLASSMORPHISM) --- */
        :root {
            --bg-base: #0f172a;           /* Fundo ultra escuro */
            --bg-surface: rgba(30, 41, 59, 0.65); /* Vidro fosco para o card */
            --bg-input: rgba(15, 23, 42, 0.6);   /* Fundo dos campos de entrada */
            --border-color: rgba(255, 255, 255, 0.08); /* Bordas sutis */
            --text-main: #f8fafc;         /* Texto principal */
            --text-muted: #94a3b8;        /* Texto secundário */
            
            --primary: #0066cc;           /* Azul SENAI */
            --primary-hover: #1d4ed8;
            --danger: #ef4444;            /* Alertas e erros */
            --danger-bg: rgba(239, 68, 68, 0.15);

            --radius-xl: 16px;
            --radius-md: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- CONFIGURAÇÕES GERAIS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- CANVAS EM MOVIMENTO (STARFIELD) --- */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient glow de fundo */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(160px);
            opacity: 0.15;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- CARD DE CADASTRO --- */
        .cadastro-card {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-width: 420px;
            width: 100%;
            padding: 40px 32px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .logo-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: #60a5fa;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        /* --- ALERTAS DE ERRO --- */
        .alerta-erro {
            background-color: var(--danger-bg);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-size: 0.88rem;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- FORMULÁRIO --- */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
            background-color: var(--bg-input);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }

        /* Botão de Envio */
        button[type="submit"] {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0066cc, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(0, 102, 204, 0.35);
            margin-top: 28px;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.5);
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Rodapé do Card */
        .card-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card-footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .card-footer a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- CANVAS DO FUNDO EM MOVIMENTO -->
    <canvas id="starfield"></canvas>

    <div class="cadastro-card">
        <div class="logo-header">AAPM SENAI</div>
        <h1>Criar Nova Conta</h1>
        
        {% if erro %}
        <div class="alerta-erro">⚠️ {{ erro }}</div>
        {% endif %}

        <form action="/auth/cadastro" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome e sobrenome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required minlength="6">
            </div>
            <button type="submit">Cadastrar Conta</button>
        </form>

        <div class="card-footer">
            Já tem uma conta? <a href="/auth/login">Entrar</a>
        </div>
    </div>

    <!-- SCRIPT DA ANIMAÇÃO DE FUNDO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('starfield');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let stars = [];
            const numStars = 700;
            const speed = 2.5;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function createStars() {
                stars = [];
                for (let i = 0; i < numStars; i++) {
                    stars.push({
                        x: (Math.random() - 0.5) * canvas.width,
                        y: (Math.random() - 0.5) * canvas.height,
                        z: Math.random() * canvas.width
                    });
                }
            }

            function updateAndDraw() {
                ctx.fillStyle = "rgba(15, 23, 42, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                stars.forEach(star => {
                    star.z -= speed;

                    if (star.z <= 0) {
                        star.z = canvas.width;
                        star.x = (Math.random() - 0.5) * canvas.width;
                        star.y = (Math.random() - 0.5) * canvas.height;
                    }

                    const k = 256 / star.z;
                    const px = star.x * k + cx;
                    const py = star.y * k + cy;

                    if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                        const size = (1 - star.z / canvas.width) * 2.2;
                        
                        ctx.fillStyle = "rgba(226, 232, 240, 0.9)";
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                requestAnimationFrame(updateAndDraw);
            }

            createStars();
            updateAndDraw();
        });
    </script>
</body>
</html>
